name: Fix Liu Peilun photo cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-liupeilun-photo-cache.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create cache-busted photo and update profile
        run: |
          set -euo pipefail
          cp static/images/people/liupeilun.jpg static/images/people/liupeilun-v2.jpg
          python - <<'PY'
          from pathlib import Path
          path = Path('data/people.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'photo: /images/people/liupeilun.jpg'
          new = 'photo: /images/people/liupeilun-v2.jpg'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Liu Peilun photo path, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruby -e "require 'yaml'; YAML.load_file('data/people.yaml'); puts 'YAML OK'"
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/people.yaml static/images/people/liupeilun-v2.jpg
          git commit -m 'Use cache-busted Liu Peilun photo'
          git push