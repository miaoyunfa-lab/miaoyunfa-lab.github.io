name: Import member SVGs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-member-svgs.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned SVG originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/images/member-cards
          base='https://raw.githubusercontent.com/balazser/undraw-svg-collection/9c02f9893198f7bce6e514be2de2b6c544775ab1/svgs'
          curl -fsSL "$base/in-the-office.svg" -o static/images/member-cards/staff.svg
          curl -fsSL "$base/medical-research.svg" -o static/images/member-cards/postdoc.svg
          curl -fsSL "$base/graduation.svg" -o static/images/member-cards/students.svg

      - name: Match site accent color
        shell: bash
        run: |
          set -euo pipefail
          for f in static/images/member-cards/*.svg; do
            sed -i 's/var(--primary-svg-color)/#0f766e/g' "$f"
          done

      - name: Commit imported SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/images/member-cards/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add local vector member illustrations'
          git push
