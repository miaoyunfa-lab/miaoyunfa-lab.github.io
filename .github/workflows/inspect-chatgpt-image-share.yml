name: Import original member artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-chatgpt-image-share.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download highest-quality public PNG attachments
        shell: bash
        env:
          SHARE_URL: 'https://chatgpt.com/s/m_6a82f9660bd8819196d8569bf5313950'
          SHARE_ID: 'm_6a82f9660bd8819196d8569bf5313950'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, html, json, base64, struct, urllib.request, urllib.error, pathlib, http.cookiejar

          share_url = os.environ['SHARE_URL']
          share_id = os.environ['SHARE_ID']
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Referer': share_url,
          }

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          page_req = urllib.request.Request(share_url, headers={'User-Agent': headers['User-Agent']})
          raw = opener.open(page_req, timeout=30).read().decode('utf-8', 'replace')
          text = html.unescape(raw).replace('\\/', '/')

          url_re = re.compile(r'https://chatgpt\.com/backend-api/estuary/public_content/enc/([A-Za-z0-9_-]+)')
          attachment_re = re.compile(re.escape(share_id) + r'-attachment-(\d+)')

          grouped = {0: [], 1: [], 2: []}
          seen = set()
          for m in url_re.finditer(text):
              token = m.group(1)
              try:
                  payload = json.loads(base64.urlsafe_b64decode(token + '=' * (-len(token) % 4)).decode('utf-8'))
              except Exception:
                  continue
              content_id = str(payload.get('id', ''))
              if 'file_' not in content_id:
                  continue
              prefix = text[max(0, m.start() - 16000):m.start()]
              hits = list(attachment_re.finditer(prefix))
              idx = int(hits[-1].group(1)) if hits else None
              key = (idx, content_id, m.group(0))
              if idx in grouped and key not in seen:
                  grouped[idx].append((content_id, m.group(0)))
                  seen.add(key)

          for idx in grouped:
              print('attachment', idx, 'variants=', [x[0] for x in grouped[idx]])

          names = {0: 'staff-source.png', 1: 'postdoc-source.png', 2: 'students-source.png'}
          out_dir = pathlib.Path('static/images/member-cards')
          out_dir.mkdir(parents=True, exist_ok=True)

          for idx, filename in names.items():
              successes = []
              for content_id, url in grouped[idx]:
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      resp = opener.open(req, timeout=60)
                      data = resp.read()
                      ctype = resp.headers.get('Content-Type', '')
                      if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) >= 24:
                          width, height = struct.unpack('>II', data[16:24])
                          print(f'attachment {idx} OK {content_id}: {len(data)} bytes {width}x{height} {ctype}')
                          successes.append((width * height, len(data), width, height, data, content_id))
                      else:
                          print(f'attachment {idx} non-PNG {content_id}: {len(data)} bytes {ctype} first={data[:12]!r}')
                  except urllib.error.HTTPError as e:
                      print(f'attachment {idx} HTTP {e.code} for {content_id}')
                  except Exception as e:
                      print(f'attachment {idx} ERROR {content_id}: {e!r}')

              if not successes:
                  raise SystemExit(f'No downloadable PNG variant found for attachment {idx}')
              # Prefer the largest pixel dimensions, then largest byte size. No re-encoding.
              successes.sort(key=lambda x: (x[0], x[1]), reverse=True)
              _, size, width, height, data, content_id = successes[0]
              path = out_dir / filename
              path.write_bytes(data)
              print(f'SELECTED attachment {idx}: {content_id} -> {path} | {size} bytes | {width}x{height}')
          PY

      - name: Commit original PNG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/images/member-cards/staff-source.png \
                  static/images/member-cards/postdoc-source.png \
                  static/images/member-cards/students-source.png
          if git diff --cached --quiet; then
            echo 'PNG files already match.'
            exit 0
          fi
          git commit -m 'Add source-quality member artwork PNGs'
          git push
