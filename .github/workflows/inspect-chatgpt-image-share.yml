name: Import original member artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-chatgpt-image-share.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original PNG attachments from public ChatGPT share
        shell: bash
        env:
          SHARE_URL: 'https://chatgpt.com/s/m_6a82f9660bd8819196d8569bf5313950'
          SHARE_ID: 'm_6a82f9660bd8819196d8569bf5313950'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, html, json, base64, struct, urllib.request, pathlib

          share_url = os.environ['SHARE_URL']
          share_id = os.environ['SHARE_ID']
          req = urllib.request.Request(share_url, headers={'User-Agent': 'Mozilla/5.0'})
          raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          text = html.unescape(raw).replace('\\/', '/')

          url_re = re.compile(r'https://chatgpt\.com/backend-api/estuary/public_content/enc/([A-Za-z0-9_-]+)')
          attachment_re = re.compile(re.escape(share_id) + r'-attachment-(\d+)')

          candidates = []
          seen_ids = set()
          for m in url_re.finditer(text):
              token = m.group(1)
              try:
                  padded = token + '=' * (-len(token) % 4)
                  payload = json.loads(base64.urlsafe_b64decode(padded).decode('utf-8'))
              except Exception:
                  continue
              content_id = str(payload.get('id', ''))
              if ':file_' not in content_id or 'sediment://' in content_id:
                  continue
              if content_id in seen_ids:
                  continue

              prefix = text[max(0, m.start() - 12000):m.start()]
              idx_hits = list(attachment_re.finditer(prefix))
              idx = int(idx_hits[-1].group(1)) if idx_hits else None
              candidates.append((idx, content_id, m.group(0)))
              seen_ids.add(content_id)

          print('actual_file_candidates=', [(x[0], x[1]) for x in candidates])
          indexed = {idx: (content_id, url) for idx, content_id, url in candidates if idx is not None}

          # This share contains three attachments. The serialized share data uses attachment-0/1/2
          # in the same order as the images uploaded by the user: staff, postdoc, students.
          expected = {0: 'staff-source.png', 1: 'postdoc-source.png', 2: 'students-source.png'}
          if not all(i in indexed for i in expected):
              raise SystemExit(f'Could not resolve all three attachment indexes. Resolved indexes: {sorted(indexed)}')

          out_dir = pathlib.Path('static/images/member-cards')
          out_dir.mkdir(parents=True, exist_ok=True)

          for idx, filename in expected.items():
              content_id, url = indexed[idx]
              r = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              data = urllib.request.urlopen(r, timeout=60).read()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'Attachment {idx} is not the original PNG; first bytes={data[:16]!r}')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1448, 1086):
                  raise SystemExit(f'Unexpected dimensions for attachment {idx}: {width}x{height}')
              path = out_dir / filename
              path.write_bytes(data)
              print(f'{idx}: {content_id} -> {path} | {len(data)} bytes | {width}x{height}')
          PY

      - name: Commit original PNG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/images/member-cards/staff-source.png \
                  static/images/member-cards/postdoc-source.png \
                  static/images/member-cards/students-source.png
          if git diff --cached --quiet; then
            echo 'Original PNG files already match.'
            exit 0
          fi
          git commit -m 'Add original high-resolution member artwork'
          git push
