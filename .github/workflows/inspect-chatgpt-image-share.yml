name: Inspect ChatGPT image share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-chatgpt-image-share.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve public ChatGPT image share
        shell: bash
        env:
          SHARE_URL: 'https://chatgpt.com/s/m_6a82f9660bd8819196d8569bf5313950'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, html, urllib.request
          url=os.environ['SHARE_URL']
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          try:
              raw=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          except Exception as e:
              print('urllib_fetch_error=',repr(e))
              raw=''
          open('/tmp/share.html','w').write(raw)
          print('html_bytes=',len(raw.encode()))
          text=html.unescape(raw).replace('\\/','/')
          patterns=[
              r'https://files\.oaiusercontent\.com/[^\"\'<> ]+',
              r'https://[^\"\'<> ]*oaistatic\.com/[^\"\'<> ]+',
              r'https://chatgpt\.com/backend-api/estuary/content\?[^\"\'<> ]+',
              r'https://[^\"\'<> ]+\.(?:png|webp|jpe?g)(?:\?[^\"\'<> ]*)?',
          ]
          found=[]
          for pat in patterns:
              for u in re.findall(pat,text):
                  if u not in found: found.append(u)
          print('html_candidates=',len(found))
          for i,u in enumerate(found[:30],1): print(f'HTML_CANDIDATE_{i}={u}')
          PY

          if command -v google-chrome >/dev/null 2>&1; then
            timeout 50s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom "$SHARE_URL" > /tmp/dom.html 2>/tmp/chrome.err || true
            python - <<'PY'
          import re, html, pathlib
          p=pathlib.Path('/tmp/dom.html')
          raw=p.read_text(errors='replace') if p.exists() else ''
          print('dom_bytes=',len(raw.encode()))
          text=html.unescape(raw).replace('\\/','/')
          patterns=[
              r'https://files\.oaiusercontent\.com/[^\"\'<> ]+',
              r'https://[^\"\'<> ]*oaistatic\.com/[^\"\'<> ]+',
              r'https://chatgpt\.com/backend-api/estuary/content\?[^\"\'<> ]+',
              r'https://[^\"\'<> ]+\.(?:png|webp|jpe?g)(?:\?[^\"\'<> ]*)?',
          ]
          found=[]
          for pat in patterns:
              for u in re.findall(pat,text):
                  if u not in found: found.append(u)
          print('dom_candidates=',len(found))
          for i,u in enumerate(found[:40],1): print(f'DOM_CANDIDATE_{i}={u}')
          PY
            echo 'chrome_stderr_tail:'
            tail -20 /tmp/chrome.err || true
          else
            echo 'google-chrome not found'
          fi
