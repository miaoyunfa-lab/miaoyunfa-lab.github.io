name: One-off fix Podocarpium DOI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Podocarpium DOI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          title = '青藏高原柴达木盆地中新世单籽豆属（Podocarpium）化石的发现及其生物地理学意义'
          canonical = 'https://doi.org/10.11928/j.issn.1001-7410.2024.06.02'
          total = 0

          for filename in ['data/publications.yaml', 'data/people.yaml']:
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              in_target = False
              changed = 0

              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('- title:'):
                      in_target = title in stripped
                  elif in_target and stripped.startswith('doi_url:'):
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = '\r\n' if line.endswith('\r\n') else '\n'
                      line = f'{indent}doi_url: {canonical}{newline}'
                      in_target = False
                      changed += 1
                  out.append(line)

              if changed:
                  path.write_text(''.join(out), encoding='utf-8')
                  print(f'{filename}: fixed {changed} occurrence(s)')
                  total += changed

          if total == 0:
              raise SystemExit('No matching DOI entries found to fix')
          print(f'Total fixed: {total}')
          PY

          rm -f .github/workflows/one-off-fix-podocarpium-doi.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.yaml data/people.yaml .github/workflows/one-off-fix-podocarpium-doi.yml
          git commit -m "Normalize Podocarpium paper DOI"
          git push
