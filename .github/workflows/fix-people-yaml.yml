name: One-time people YAML repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-people-yaml.yml'
      - 'data/people.yaml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quote YAML title and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/people.yaml')
          s = p.read_text(encoding='utf-8')
          old = '  - title: Millet in the Bronze Age Altai Mountains: discovery, progress and research prospects'
          new = "  - title: 'Millet in the Bronze Age Altai Mountains: discovery, progress and research prospects'"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          ruby -e "require 'yaml'; YAML.load_file('data/people.yaml'); puts 'YAML OK'"
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- data/people.yaml; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/people.yaml
          git commit -m 'Fix people YAML parsing'
          git push
