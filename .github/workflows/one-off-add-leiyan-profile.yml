name: One-off add Lei Yan profile

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Lei Yan alumni profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('data/people.yaml')
          text = path.read_text(encoding='utf-8')
          marker = '- name: 雷艳\n'
          encoded = ''
          if marker not in text:
              entry = base64.b64decode(encoded).decode('utf-8')
              if not text.endswith('\n'):
                  text += '\n'
              path.write_text(text + '\n' + entry, encoding='utf-8')
          PY
          rm -f .github/workflows/one-off-add-leiyan-profile.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people.yaml .github/workflows/one-off-add-leiyan-profile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Lei Yan alumni profile"
          git push
