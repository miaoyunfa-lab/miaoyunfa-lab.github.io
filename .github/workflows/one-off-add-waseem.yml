name: One-off add Muhammad Tahir Waseem

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Muhammad Tahir Waseem profile
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('data/people.yaml')
          text = path.read_text(encoding='utf-8')
          marker = '- name: Muhammad Tahir Waseem\n'
          payload = ''
          if marker not in text:
              entry = base64.b64decode(payload).decode('utf-8')
              if not text.endswith('\n'):
                  text += '\n'
              path.write_text(text + entry, encoding='utf-8')
          PY
          rm -f .github/workflows/one-off-add-waseem.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people.yaml .github/workflows/one-off-add-waseem.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Muhammad Tahir Waseem profile"
          git push
