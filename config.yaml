title: "孢粉学与生态环境研究组"
summaryLength: 30
params:
  lab_name: "孢粉学与生态环境研究组"
  tagline: "欢迎访问我们的学术主页"
  pi_name: "苗运法"
  affiliation: "中国科学院西北生态环境资源研究院 干旱区生态安全与可持续发展重点实验室"
  email: "yunfine2000@sina.com"
  address: "甘肃省兰州市城关区东岗西路320号，730000，中国"
  hero_text: "以孢粉为钥，解码新生代生态演变"
  hero_subtext: "本课题组由苗运法研究员领导，依托中国科学院西北生态环境资源研究院干旱区生态安全与可持续发展重点实验室。团队长期深耕新生代孢粉学与古环境学研究，致力于通过高分辨率的孢粉记录，系统重建青藏高原及其周边干旱区在不同时间尺度上的植被演变与气候动力学过程。通过揭示过去环境变化的演化规律，为理解区域生态演变趋势及生态文明建设提供关键的科学证据与理论支撑。"
  research_groups:
    - title: "研究方向"
      items:
        - title: "古生态与干旱环境演化"
          text: "聚焦亚洲内陆干旱区，利用孢粉、炭屑等生物代用指标，重建新生代以来古生态与古环境演化历史，揭示干旱气候与火灾活动的时空演变规律及其驱动机制。"
        - title: "全球变化生态学"
          text: "研究长时间尺度下生态系统对全球气候变化的响应与反馈，探讨过去温暖期和关键气候转型期的生态格局变迁及其对未来的启示。"
        - title: "孢粉学"
          text: "发展孢粉现代过程、表土花粉-植被-气候定量关系，建立亚洲干旱区花粉生产力标准，为古环境定量重建提供关键参数与数据支撑。"
