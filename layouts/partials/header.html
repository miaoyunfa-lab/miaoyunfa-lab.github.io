<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.lab_name }} home">
      <img src="{{ "images/logo/logo.png" | relURL }}" alt="{{ site.Params.lab_name }}">
    </a>
    {{ if site.Params.show_header_navigation }}
      <nav aria-label="主导航">
        <ul class="nav-list">
          {{ range site.Menus.main }}
            <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    {{ end }}
  </div>
</header>
